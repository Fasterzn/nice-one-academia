<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background-color:#080A0B;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#080A0B;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#111315;border:1px solid rgba(255,255,255,0.08);border-radius:12px;">
            <tr>
              <td style="padding:32px 28px 8px 28px;font-family:Arial,Helvetica,sans-serif;">
                <p style="margin:0;font-size:26px;line-height:1;font-weight:bold;color:#FFFFFF;letter-spacing:0.5px;">
                  NICE<span style="color:#00E63F;">ONE</span>
                </p>
                <p style="margin:6px 0 0 0;font-size:10px;letter-spacing:5px;color:#A3A9AE;text-transform:uppercase;">
                  Academia
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px 0 28px;font-family:Arial,Helvetica,sans-serif;">
                <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.2;color:#FFFFFF;">Confirme seu novo e-mail</h1>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#A3A9AE;">Use o código abaixo para confirmar a troca de e-mail.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#080A0B;border:1px solid #00E63F;border-radius:8px;">
                  <tr>
                    <td align="center" style="padding:18px 32px;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:bold;letter-spacing:10px;color:#00E63F;">
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px 28px;font-family:Arial,Helvetica,sans-serif;">
                <p style="margin:0 0 8px 0;font-size:13px;line-height:1.6;color:#A3A9AE;">
                  O código expira em 10 minutos.
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#A3A9AE;">
                  Se você não fez este pedido, ignore este e-mail.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px;border-top:1px solid rgba(255,255,255,0.08);font-family:Arial,Helvetica,sans-serif;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#6C7278;">
                  Nice One Academia &middot; Sertãozinho - SP<br />
                  Invista na saúde para não gastar na doença!
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
